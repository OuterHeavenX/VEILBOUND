<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a0d" />
  <meta name="description" content="VEILBOUND — an atmospheric action-adventure RPG set in the ruined world of Eidol." />
  <title>VEILBOUND</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./menu.css" />
</head>
<body>
  <main id="app" aria-label="VEILBOUND game">
    <section id="boot-screen" class="boot-screen" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">◇</div>
      <h1>VEILBOUND</h1>
      <p id="boot-status">Awakening the Vein…</p>
      <noscript>VEILBOUND requires JavaScript to run.</noscript>
    </section>
    <section id="title-screen" class="title-screen" hidden aria-label="VEILBOUND title">
      <div class="title-mark" aria-hidden="true">◇</div>
      <h1 class="title-word">VEILBOUND</h1>
      <p class="title-tagline">THE VEIN IS WAKING</p>
      <p id="title-notice" class="title-notice" hidden role="status"></p>
      <div id="title-menu" class="title-menu">
        <button id="title-continue" class="title-button" type="button" hidden><span class="title-button-label">CONTINUE</span><span id="title-continue-detail" class="title-button-detail"></span></button>
        <button id="title-new" class="title-button" type="button"><span class="title-button-label">NEW GAME</span></button>
        <button id="title-settings" class="title-button" type="button"><span class="title-button-label">SETTINGS</span></button>
      </div>
      <div id="title-confirm" class="title-confirm" hidden>
        <p id="title-confirm-text" class="title-confirm-text"></p>
        <button id="title-confirm-yes" class="title-button title-button-danger" type="button"></button>
        <button id="title-confirm-no" class="title-button" type="button">CANCEL</button>
      </div>
      <p id="title-hint" class="title-hint"></p>
      <p id="title-version" class="title-version"></p>
    </section>
    <section id="settings-screen" class="title-screen" hidden aria-label="Settings">
      <h2 class="title-word title-word-small">SETTINGS</h2>
      <div class="title-menu">
        <button id="settings-audio" class="title-button" type="button" aria-pressed="true"></button>
        <button id="settings-diagnostics" class="title-button" type="button" aria-pressed="false"></button>
        <button id="settings-erase" class="title-button title-button-danger" type="button" hidden>ERASE SAVED JOURNEY</button>
        <button id="settings-back" class="title-button" type="button">BACK</button>
      </div>
    </section>
    <canvas id="game-canvas" width="1280" height="720" tabindex="0" aria-label="VEILBOUND game canvas"></canvas>
    <div id="hud" class="hud" hidden><div><div class="hud-brand">VEILBOUND <span class="hud-version">v0.2.1-menu</span></div><div id="hud-health" class="hud-health" aria-label="Health">◆ ◆ ◆ ◆ ◆ ◆</div><div id="hud-ability" class="hud-ability">AXIOM: DORMANT</div></div><div class="hud-right"><div id="hud-room">GREYHAVEN</div><div id="save-status" class="save-status">SAVE V1 READY</div></div></div>
    <div id="interact-prompt" class="interact-prompt" hidden aria-live="polite"><span id="interact-prompt-verb" class="interact-prompt-verb">TALK</span><span id="interact-prompt-name" class="interact-prompt-name"></span></div>
    <pre id="debug-overlay" class="debug-overlay" hidden aria-hidden="true"></pre>
    <div id="dialogue" class="dialogue" hidden aria-live="polite"><div id="dialogue-speaker" class="dialogue-speaker"></div><div id="dialogue-text" class="dialogue-text"></div><div class="dialogue-hint">TAP / A / SPACE</div></div>
    <div id="touch-controls" class="touch-controls" hidden aria-label="Touch controls"><div id="touch-stick" class="touch-stick" aria-hidden="true"><div id="touch-knob" class="touch-knob"></div></div><div class="touch-actions"><button id="resonance-button" class="resonance-button" type="button" aria-label="Use Axiom Resonance" hidden>◇</button><button id="action-button" class="action-button" type="button" aria-label="Attack with Shardblade">⚔</button></div></div>
    <div id="fatal-error" class="fatal-error" hidden role="alert"><h2>VEILBOUND could not start</h2><p id="fatal-error-message"></p></div>
  </main>
  <!-- Classic scripts preserve true zero-build, file:// friendly startup. -->
  <script src="./src/core/SaveManager.js"></script>
  <script src="./src/core/Audio.js"></script>
  <script src="./src/data/characterSprites.js"></script>
  <script src="./src/data/enemySprites.js"></script>
  <script src="./src/data/terrain.js"></script>
  <script src="./src/data/props.js"></script>
  <script src="./src/core/Sprites.js"></script>
  <script src="./src/data/enemies.js"></script>
  <script src="./src/data/interactables.js"></script>
  <script src="./src/ui/TitleScreen.js"></script>
  <script src="./src/ui/CharacterMenu.js"></script>
  <script src="./src/core/Progression.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
