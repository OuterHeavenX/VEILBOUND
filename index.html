<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1014" />
  <meta name="description" content="VEILBOUND — an atmospheric action-adventure RPG set in the ruined world of Eidol." />
  <title>VEILBOUND</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" aria-label="VEILBOUND game">
    <section id="boot-screen" class="boot-screen" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">◇</div>
      <h1>VEILBOUND</h1>
      <p id="boot-status">Awakening the Vein…</p>
      <noscript>VEILBOUND requires JavaScript to run.</noscript>
    </section>

    <canvas id="game-canvas" width="1280" height="720" tabindex="0" aria-label="VEILBOUND game canvas"></canvas>

    <div id="hud" class="hud" hidden>
      <div class="hud-brand">VEILBOUND <span class="hud-version">v0.1.1-playable</span></div>
      <div id="hud-room">GREYHAVEN</div>
    </div>

    <div id="touch-controls" class="touch-controls" hidden aria-label="Touch controls">
      <div id="touch-stick" class="touch-stick" aria-hidden="true"><div id="touch-knob" class="touch-knob"></div></div>
      <button id="action-button" class="action-button" type="button" aria-label="Interact or use Axiom">A</button>
    </div>

    <div id="fatal-error" class="fatal-error" hidden role="alert">
      <h2>VEILBOUND could not start</h2>
      <p id="fatal-error-message"></p>
    </div>
  </main>

  <!-- Deliberately classic-script based for true zero-build, file:// friendly startup. -->
  <script src="./src/main.js"></script>
</body>
</html>
